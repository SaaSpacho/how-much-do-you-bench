# Your harness configuration: which agent runs, against which model, with which
# skills, MCP servers and prompt. It is Harbor's own JobConfig, so it is what
# actually runs rather than a translation layer.
#
#   just eval           # run this config against a task
#   just show-config    # print what it resolves to, without running anything
#
# `agents` is a list. A second entry runs both against the same task in one
# command, which is the cheap way to check that your work beats the harness you
# started from.
#
# In a graded run:
#
#   * Only the FIRST entry is graded. List several while you compare, put the
#     one you mean on top before you submit.
#   * `name`, `import_path`, `model_name`, `skills`, `mcp_servers` and `kwargs`
#     are honoured. Anything else (`mounts`, `env`, a task path) is refused.
#   * `skills:` paths are resolved inside your commit, so commit the directory.
#
# A config that breaks those rules is rejected at `just submit`, with the
# reason, and does not spend one of your submissions.
#
# What each harness needs against this model, and which ones cannot reach it at
# all, is in docs/harnesses.md.

agents:
  - name: claude-code
    # The `gateway` provider is defined under kwargs below. opencode's adapter
    # refuses a model_name with no provider prefix.
    model_name: gateway/gemma
    skills:
      - ./skills/polars
      - ./skills/docs
    mcp_servers:
      - name: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
    kwargs:
      append_system_prompt: |
        # Engineering rules

        You are completing a coding task in this workspace. These rules apply to every
        task, regardless of language or problem.

        ## Verify by execution before you finish
        - Never declare the task done from reasoning alone. Before your final message
          you MUST actually run your code and confirm it behaves as required.
        - Write a short scratch script that exercises the normal cases, the boundaries,
          and the error paths. Run it, compare the real output to what is expected, and
          fix and re-run within the iteration budget below.
        - Pay extra attention to edge and error cases: actually trigger each one rather
          than assuming it works. A solution that looks correct often fails a case you
          never executed.
        - A test run that collects nothing ("no tests ran", "collected 0 items",
          "Ran 0 tests") has verified NOTHING — treat it as a failure signal, not
          success. If no test suite is present, that is expected: do not stop there.
          Write your own checks from the task's stated examples and run those instead.

        ## Bound your verification loop (max 3 test iterations)
        - You have a strict budget: run your checks at most THREE times for the whole
          task. Each run-fix-rerun counts as one iteration.
        - If your checks still fail after the third run, STOP iterating. Apply your
          single best correction, briefly note in your final message what still looks
          wrong, and finish. Do not keep editing past the budget.
        - Do not re-edit the same file more than three times. Repeating an edit that did
          not work is a signal to stop and submit your best attempt — not to try again.
        - Finishing with a graded best attempt is always better than looping until you
          run out of time. Never spend the whole session churning on the same failure.

        ## Produce code you have validated
        - Treat tests as part of the deliverable, not an afterthought. Cover the happy
          path, edge cases (empty inputs, boundaries, zero/large values), and error
          handling.
        - Keep checks small, deterministic, and isolated so they are fast to re-run.
        - Clean up any scratch files before you finish.

        ## Preserve the exact interface
        - Preserve the interface implied by the task: function/class names, signatures,
          parameter names, defaults, required imports, and return types. Do not rename or re-sign the code
          you were given.
        - When the task specifies exact behavior — output text, error messages, formats —
          produce it as specified.

        ## Write code that holds up
        - Prefer clear, conventional code over cleverness; match the style of the
          surrounding code.
        - Raise specific, meaningful exceptions; do not silently swallow errors.
        - Keep changes scoped to the task at hand.
      opencode_config:
        # Your system prompt. `build` is the agent `opencode run` uses, and
        # `prompt` replaces opencode's own, so it has to say everything the
        # model needs, not just your additions. Inline text only: opencode
        # resolves `{file:...}` paths inside the task container, and nothing
        # from this repo is there.
        #
        # agent:
        #   build:
        #     prompt: |
        #       You are a data engineer working in a Linux container.
        #       Read before you edit, change one thing at a time, and re-run
        #       the task's own check before you say you are done.

        # A provider id opencode does not recognise gets chat completions,
        # which is the route on which it can see this model's reasoning.
        # `gemma` is not in models.dev, so the capabilities are stated here.
        provider:
          gateway:
            npm: "@ai-sdk/openai-compatible"
            options:
              baseURL: "{env:GATEWAY_URL}"
              apiKey: "{env:GATEWAY_API_KEY}"
            models:
              gemma:
                reasoning: true
                tool_call: true
                interleaved:
                  field: reasoning_content
                limit:
                  context: 262144
                  output: 8192
                options:
                  reasoningEffort: high

  # Your own agent: the `agent/` directory, run as `uv run agent --instruction`.
  #
  # - name: custom
  #   import_path: adapter.submission_agent:Submission
  #   model_name: gemma

  # - name: claude-code
  #   model_name: gemma
  #   kwargs:
  #     # Appended to claude-code's own prompt rather than replacing it. Keep
  #     # it to one line: it reaches the command unquoted.
  #     append_system_prompt: "Re-run the task's own check before you finish."

  # - name: pi
  #   model_name: gateway/gemma   # pi's own gateway provider, from the image

  # Skills, MCP servers and harness kwargs, on any agent above.
  #
