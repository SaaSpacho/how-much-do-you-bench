# Your harness configuration: which agent runs, against which model, with which
# skills, MCP servers and prompt. It is Harbor's own JobConfig, so it is what
# actually runs rather than a translation layer.
#
#   just eval           # run this config against a task
#   just show-config    # print what it resolves to, without running anything
#
# `agents` is a list. A second entry runs both against the same task in one
# command, which is the cheap way to check that your work beats the harness you
# started from.
#
# In a graded run:
#
#   * Only the FIRST entry is graded. List several while you compare, put the
#     one you mean on top before you submit.
#   * `name`, `import_path`, `model_name`, `skills`, `mcp_servers` and `kwargs`
#     are honoured. Anything else (`mounts`, `env`, a task path) is refused.
#   * `skills:` paths are resolved inside your commit, so commit the directory.
#
# A config that breaks those rules is rejected at `just submit`, with the
# reason, and does not spend one of your submissions.
#
# What each harness needs against this model, and which ones cannot reach it at
# all, is in docs/harnesses.md.

agents:
  - name: opencode
    # The `gateway` provider is defined under kwargs below. opencode's adapter
    # refuses a model_name with no provider prefix.
    model_name: gateway/gemma
    skills:
      - ./skills/polars
      - ./skills/docs
      - ./skills/caveman
    mcp_servers:
      - name: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
    kwargs:
      append_system_prompt: |
        # Documentation

        Before tackling ANY task, use the docs skill to read ALL the documentation.

        # Engineering rules

        Apply these to every task, regardless of language or problem.

        ## Verify before finishing
        Never declare done from reasoning alone — write a script covering normal cases,
        boundaries, and error paths, run it, and compare actual vs. expected output.
        A test run reporting zero collected/executed tests is a failure signal, not
        success; if no suite exists, write checks from the task's own examples.

        ## Iteration budget: 3 runs max
        Run your checks at most 3 times total for the whole task. If still failing
        after the 3rd, stop: apply your best correction, note what's still wrong, and
        finish. Don't keep re-editing the same file past 3 attempts hoping it works.

        ## Preserve the interface
        Keep names, signatures, parameter names, defaults, imports, and return types
        exactly as given. Match specified output text, error messages, and formats
        exactly.

        ## Code quality
        Match the surrounding style over cleverness. Raise specific exceptions rather
        than swallowing errors. Clean up scratch files before finishing.
      opencode_config:
        # Your system prompt. `build` is the agent `opencode run` uses, and
        # `prompt` replaces opencode's own, so it has to say everything the
        # model needs, not just your additions. Inline text only: opencode
        # resolves `{file:...}` paths inside the task container, and nothing
        # from this repo is there.
        #
        # agent:
        #   build:
        #     prompt: |
        #       You are a data engineer working in a Linux container.
        #       Read before you edit, change one thing at a time, and re-run
        #       the task's own check before you say you are done.

        # A provider id opencode does not recognise gets chat completions,
        # which is the route on which it can see this model's reasoning.
        # `gemma` is not in models.dev, so the capabilities are stated here.
        provider:
          gateway:
            npm: "@ai-sdk/openai-compatible"
            options:
              baseURL: "{env:GATEWAY_URL}"
              apiKey: "{env:GATEWAY_API_KEY}"
            models:
              gemma:
                reasoning: true
                tool_call: true
                interleaved:
                  field: reasoning_content
                limit:
                  context: 262144
                  output: 8192
                options:
                  reasoningEffort: high

  # Your own agent: the `agent/` directory, run as `uv run agent --instruction`.
  #
  # - name: custom
  #   import_path: adapter.submission_agent:Submission
  #   model_name: gemma

  # - name: claude-code
  #   model_name: gemma
  #   kwargs:
  #     # Appended to claude-code's own prompt rather than replacing it. Keep
  #     # it to one line: it reaches the command unquoted.
  #     append_system_prompt: "Re-run the task's own check before you finish."

  # - name: pi
  #   model_name: gateway/gemma   # pi's own gateway provider, from the image

